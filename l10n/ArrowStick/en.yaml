page_name: Arrow Stick
page_desc: Arrows, bolts, and throwing weapons will now stick into the ground and objects.

settings_groupName: Settings
despawnArrows_name: Unloaded Arrows Despawn
despawnArrows_desc: Does not retroactively affect arrows shot while this setting was disabled.
stickChance_name: Stick Chance
stickChance_desc: |
  Percentage chance for the arrow to stick in a surface.
  
  Set to -1 to match vanilla store chance mechanic.
stickEnchanted_name: Stick Enchanted Arrows
stickEnchanted_desc: >
  In vanilla, enchanted projectiles are never stored in the victim's inventory on hit.
stickUnderwater_name: Stick Arrows Underwater
stickUnderwater_desc: In vanilla, projectiles cease to exist once they touch water.
enableScatter_name: Enable Scatter
enableScatter_desc: >
  Adds a small random deviation to the arrow's path, making them less likely to stick into each other.

impactEffects_groupName: Impact Effects Integration
impactEffects_groupDesc: These features require Impact Effects to be installed.
impactEffects_name: Enable Impact Effects
impactEffects_desc: Create VFX on impact or not. Assumes the projectile is moving at maximum speed.
checkMaterial_name: Check Hit Object Material
checkMaterial_desc: |
  Makes arrows not stick into certain materials.

  Blacklisted materials:
  - Stone
  - Metal